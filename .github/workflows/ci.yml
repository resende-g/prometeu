name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/prometeu
      - run: python -m pytest
      - run: python -m build
      - run: prometeu --help
      - run: prometeu convert --help

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e '.[dev]'
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: apps/desktop
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - run: cargo +1.88.0 fmt --check && cargo +1.88.0 check --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo +1.88.0 test --locked -- --include-ignored
        working-directory: apps/desktop/src-tauri
        env:
          PROMETEU_PYTHON: ${{ env.pythonLocation }}/bin/python
