[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prometeu"
version = "0.1.0"
description = "Conversão local e conservadora de PDF textual para EPUB 3"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pdfplumber==0.11.10"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6", "mypy==2.3.1", "build==1.6.0"]

[project.scripts]
prometeu = "prometeu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/prometeu"]
